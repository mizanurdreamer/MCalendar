services:
  db:
    container_name: bookingCalendar-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingcalendar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: bookingCalendar-app
    build:
      context: .
      dockerfile: Dockerfile
    image: bookingcalendar-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/bookingcalendar?schema=public"
      JWT_ACCESS_SECRET: "prod-access-secret-change-me-in-production-32chars!!"
      JWT_REFRESH_SECRET: "prod-refresh-secret-change-me-in-production-32chars!!"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      NODE_ENV: "production"
      BOOKING_DATA_FETCH_ENABLED: "true"
      CRON_BOOKING_DATA_FETCH_INTERVAL_MS: "300000"
      CRON_FETCH_TIMEOUT_MS: "30000"
      CRON_API_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
