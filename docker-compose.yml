services:
  db:
    container_name: bookingCalendar-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingcalendar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: bookingCalendar-app
    build:
      context: .
      dockerfile: Dockerfile
    image: bookingcalendar-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/bookingcalendar?schema=public"
      JWT_ACCESS_SECRET: "prod-access-secret-change-me-in-production-32chars!!"
      JWT_REFRESH_SECRET: "prod-refresh-secret-change-me-in-production-32chars!!"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      NODE_ENV: "${NODE_ENV:-production}"
      SMS_SMTP_HOST: "${SMS_SMTP_HOST:-}"
      SMS_SMTP_PORT: "${SMS_SMTP_PORT:-587}"
      SMS_SMTP_SECURE: "${SMS_SMTP_SECURE:-false}"
      SMS_SMTP_TLS_SERVERNAME: "${SMS_SMTP_TLS_SERVERNAME:-}"
      SMS_SMTP_TLS_REJECT_UNAUTHORIZED: "${SMS_SMTP_TLS_REJECT_UNAUTHORIZED:-true}"
      SMS_SMTP_USER: "${SMS_SMTP_USER:-}"
      SMS_SMTP_PASS: "${SMS_SMTP_PASS:-}"
      SMS_EMAIL_FROM: "${SMS_EMAIL_FROM:-}"
      CRON_BOOKING_DATA_FETCH_ENABLED: "true"
      CRON_BOOKING_DATA_FETCH_SCHEDULE_IN_MINUTES: "10"
      CRON_BOOKING_ENDPOINT_API_SECRET: "${CRON_BOOKING_ENDPOINT_API_SECRET:-}"
      CRON_AUTO_ASSIGN_CLEANER_ENABLED: "${CRON_AUTO_ASSIGN_CLEANER_ENABLED:-true}"
      CRON_AUTO_ASSIGN_CLEANER_SCHEDULE_IN_MINUTES: "${CRON_AUTO_ASSIGN_CLEANER_SCHEDULE_IN_MINUTES:-60}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
